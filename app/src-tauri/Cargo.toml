[package]
name = "gsystem-editor"
version = "0.1.0"
edition = "2021"
description = "Modern librarian/editor for the TC Electronic G-System"
license = "GPL-3.0-or-later"

[lib]
name = "gsystem_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gsystem-protocol = { path = "../../crates/gsystem-protocol", features = ["serde"] }
midir = "0.10"
